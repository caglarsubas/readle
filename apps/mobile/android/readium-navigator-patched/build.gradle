apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'org.readium.r2.navigator'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig { minSdk rootProject.ext.minSdkVersion }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xconsistent-data-class-copy-visibility', '-opt-in=org.readium.r2.shared.InternalReadiumApi']
    }
    sourceSets.main {
        manifest.srcFile 'build/upstream/src/main/AndroidManifest.xml'
        java.srcDir 'build/upstream/src/main/java'
        res.srcDir 'build/upstream/src/main/res'
        assets.srcDir 'build/upstream/src/main/assets'
    }
}

def prepareReadium = tasks.register('prepareReadium', Exec) {
    inputs.files(rootProject.file('../../../scripts/prepare_readium.py'), rootProject.file('../../../patches/readium-selection.patch'), rootProject.file('../../../patches/readium-selection-anchors.js'))
    outputs.dir(layout.buildDirectory.dir('upstream'))
    commandLine 'python3', rootProject.file('../../../scripts/prepare_readium.py'), layout.buildDirectory.dir('upstream').get().asFile
}
preBuild.dependsOn prepareReadium

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    api 'org.readium.kotlin-toolkit:readium-shared:3.1.2'
    implementation files('build/upstream/libs/PhotoView-2.3.0.jar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.7'
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media3:media3-session:1.7.1'
    implementation 'androidx.media3:media3-common-ktx:1.7.1'
    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'org.jsoup:jsoup:1.18.1'
}
